name: discord-git

on:
  push:
    branches: [master]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Post git update
        env:
          HOOK: ${{ secrets.DISCORD_GIT_WEBHOOK }}
          SHA: ${{ github.sha }}
          MSG: ${{ github.event.head_commit.message }}
          AUTHOR: ${{ github.event.head_commit.author.name }}
          URL: ${{ github.event.head_commit.url }}
          REF: ${{ github.ref_name }}
        run: |
          python3 << 'PY'
          import json, os, urllib.request
          hook = os.environ["HOOK"]
          msg = (os.environ.get("MSG") or "push").split("\n")[0][:180]
          body = {
              "username": "Cuebox",
              "embeds": [{
                  "title": "git / " + os.environ.get("REF", "master"),
                  "description": "`" + os.environ["SHA"][:7] + "` " + msg,
                  "url": os.environ.get("URL") or "https://github.com/binx-ux/Music-engine-",
                  "color": 13217642,
                  "footer": {"text": os.environ.get("AUTHOR") or "cuebox"},
              }],
          }
          req = urllib.request.Request(
              hook,
              data=json.dumps(body).encode(),
              headers={"Content-Type": "application/json", "User-Agent": "Cuebox"},
          )
          urllib.request.urlopen(req)
          PY
