name: discord-version

on:
  release:
    types: [published]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Post version
        env:
          HOOK: ${{ secrets.DISCORD_VERSION_WEBHOOK }}
          TAG: ${{ github.event.release.tag_name }}
          NAME: ${{ github.event.release.name }}
          BODY: ${{ github.event.release.body }}
          URL: ${{ github.event.release.html_url }}
        run: |
          python3 << 'PY'
          import json, os, urllib.request
          tag = os.environ.get("TAG") or ""
          name = os.environ.get("NAME") or ("Cuebox " + tag)
          notes = (os.environ.get("BODY") or "").strip()[:900]
          zip_url = "https://github.com/binx-ux/Music-engine-/releases/download/" + tag + "/Cuebox.zip"
          body = {
              "username": "Cuebox",
              "embeds": [{
                  "title": name,
                  "description": notes if notes else ("Cuebox " + tag),
                  "url": os.environ.get("URL") or "",
                  "color": 13217642,
                  "fields": [{"name": "download", "value": zip_url}],
              }],
          }
          req = urllib.request.Request(
              os.environ["HOOK"],
              data=json.dumps(body).encode(),
              headers={"Content-Type": "application/json", "User-Agent": "Cuebox"},
          )
          urllib.request.urlopen(req)
          PY
