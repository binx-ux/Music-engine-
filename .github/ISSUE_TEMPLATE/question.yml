name: Question
description: Setup, devices, or "how do I"
title: "[q] "
labels: ["question"]
body:
  - type: textarea
    id: ask
    attributes:
      label: Question
    validations:
      required: true
  - type: dropdown
    id: already
    attributes:
      label: Did you read these
      options:
        - README
        - docs/VIRTUAL_DEVICE.md
        - docs/spotify.md
        - None yet
    validations:
      required: true
